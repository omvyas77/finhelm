# Build in Google's infrastructure rather than locally.
#
# Not a preference — the image is 5.76 GB, and pushing that from a home connection is
# 20–40 minutes every time. Cloud Build pulls the source, builds there, and pushes to
# Artifact Registry inside Google's network. It also means a machine with no Docker
# installed can ship a release.
#
#   gcloud builds submit --config deploy/cloudrun/cloudbuild.yaml
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/finhelm/api:$SHORT_SHA
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/finhelm/api:latest
      # Reuse the previous image's layers. Without this every build re-downloads torch and
      # re-fetches 1.5 GB of model weights.
      - --cache-from=us-central1-docker.pkg.dev/$PROJECT_ID/finhelm/api:latest
      - .
    env:
      - DOCKER_BUILDKIT=1

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, us-central1-docker.pkg.dev/$PROJECT_ID/finhelm/api]

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/finhelm/api:$SHORT_SHA
  - us-central1-docker.pkg.dev/$PROJECT_ID/finhelm/api:latest

options:
  # The default worker has 4 GB of RAM. This build installs torch, resolves 213 pinned
  # packages and loads two models to verify them offline; it needs the headroom.
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100

timeout: 2400s
