# Committed as a template with no values in it. `stringData` is left empty on purpose so
# that applying this file cannot overwrite real keys with blanks.
#
# Create the real one out of band and never from a file in git:
#
#   kubectl -n finhelm create secret generic finhelm-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=GOOGLE_API_KEY=...
#
# A Secret is base64, not encryption. For anything beyond a demo this should be an
# External Secrets Operator reference or a cloud KMS-backed CSI driver, so the value
# never exists in the cluster's etcd in a form an etcd read can recover.
apiVersion: v1
kind: Secret
metadata:
  name: finhelm-secrets
  namespace: finhelm
type: Opaque
stringData: {}
